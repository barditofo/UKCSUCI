<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member Login | UKC-SUCI</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #1B5C54;
  --teal: #1B5C54;
  --teal-light: #2A7A70;
  --sky: #EBF4F3;
  --cream: #F7FAFA;
  --text: #1A2E2C;
  --muted: #6B7A7A;
  --border: rgba(27,92,84,0.14);
  --error: #DC2626;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter',sans-serif; background:var(--cream); color:var(--text); min-height:100vh; display:flex; flex-direction:column; }
h1,h2,h3,h4 { font-family:'Manrope',sans-serif; }

.topbar { background:white; border-bottom:1px solid var(--border); padding:0.5rem 5vw; display:flex; align-items:center; justify-content:space-between; }
.topbar-back { font-size:0.75rem; color:var(--muted); text-decoration:none; transition:color 0.2s; font-family:'Inter',sans-serif; }
.topbar-back:hover { color:var(--navy); }

.login-wrap { flex:1; display:flex; align-items:center; justify-content:center; padding:3rem 5vw; }
.login-card { background:white; border:1px solid var(--border); box-shadow:0 4px 24px rgba(0,0,0,0.05); width:100%; max-width:440px; overflow:hidden; }
.login-header { background:var(--navy); padding:2rem 2.5rem; text-align:center; }
.login-header h1 { font-family:'Manrope',sans-serif; font-weight:800; font-size:1.5rem; color:white; margin-bottom:0.4rem; }
.login-header p { font-size:0.78rem; color:rgba(255,255,255,0.6); line-height:1.6; font-family:'Inter',sans-serif; }
.login-body { padding:2rem 2.5rem; }

.form-group { margin-bottom:1.25rem; }
label { display:block; font-size:0.74rem; font-weight:600; color:var(--navy); margin-bottom:0.45rem; font-family:'Inter',sans-serif; }
.form-control { width:100%; padding:0.7rem 1rem; border:1.5px solid var(--border); border-radius:0; font-size:0.84rem; font-family:'Inter',sans-serif; color:var(--text); background:white; transition:border-color 0.2s, box-shadow 0.2s; outline:none; }
.form-control:focus { border-color:var(--teal); box-shadow:0 0 0 3px rgba(27,92,84,0.1); }
.form-control::placeholder { color:#bcc0cc; }

.btn { display:flex; align-items:center; justify-content:center; width:100%; padding:0.8rem 1.5rem; border-radius:0; font-size:0.85rem; font-weight:600; cursor:pointer; transition:all 0.25s; font-family:'Inter',sans-serif; border:none; text-decoration:none; letter-spacing:0.03em; }
.btn-navy { background:var(--navy); color:white; }
.btn-navy:hover { background:#134840; }
.btn-navy:disabled { opacity:0.6; cursor:not-allowed; }

.forgot-link { display:block; text-align:center; font-size:0.75rem; color:var(--teal); text-decoration:none; margin-top:1rem; font-weight:600; font-family:'Inter',sans-serif; }
.forgot-link:hover { text-decoration:underline; }

.join-prompt { background:var(--sky); padding:1.25rem; text-align:center; border-top:1px solid var(--border); }
.join-prompt p { font-size:0.76rem; color:var(--muted); line-height:1.6; font-family:'Inter',sans-serif; }
.join-prompt a { color:var(--teal); font-weight:600; text-decoration:none; }

.error-box { display:none; background:#FEF2F2; border-left:3px solid var(--error); padding:0.85rem 1rem; font-size:0.76rem; color:var(--error); margin-bottom:1.25rem; line-height:1.5; font-family:'Inter',sans-serif; }
.error-box.show { display:block; }

.loading-screen { display:none; text-align:center; padding:3rem 2rem; }
.loading-screen.show { display:block; }
.spinner { width:40px; height:40px; border:3px solid var(--border); border-top-color:var(--teal); border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 1rem; }
@keyframes spin { to { transform:rotate(360deg); } }

.login-footer { text-align:center; padding:1.5rem; font-size:0.7rem; color:var(--muted); font-family:'Inter',sans-serif; }
.login-footer a { color:var(--teal); text-decoration:none; }
</style>
</head>
<body>

<div class="topbar">
  <a href="https://www.ukcsuci.org.uk/">
    <img src="https://cdn.prod.website-files.com/696039a5d62b8aec0b139443/6a2c5ef373f6c958f8677e8a_uk.svg" alt="UKC-SUCI" style="height:60px;width:auto;display:block;margin:-8px 0;">
  </a>
  <a href="https://www.ukcsuci.org.uk/" class="topbar-back">Back to UKC-SUCI</a>
</div>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-header">
      <h1>Member Login</h1>
      <p>Log in to access your membership dashboard and resources.</p>
    </div>
    <div class="login-body" id="login-body">
      <div class="error-box" id="error-box"></div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" class="form-control" id="login-email" placeholder="your@email.ac.uk">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" class="form-control" id="login-password" placeholder="Enter your password">
      </div>
      <button class="btn btn-navy" id="login-btn" onclick="handleLogin()">Log In</button>
      <a href="#" class="forgot-link" onclick="handleForgot(event)">Forgot your password?</a>
    </div>
    <div class="loading-screen" id="loading-screen">
      <div class="spinner"></div>
      <p style="font-size:0.82rem;color:var(--muted);">Logging you in…</p>
    </div>
    <div class="join-prompt">
      <p>Not a member yet? <a href="/join">Apply to join UKC-SUCI</a></p>
    </div>
  </div>
</div>

<div class="login-footer">
  Need help? <a href="mailto:info@ukcsuci.org.uk">info@ukcsuci.org.uk</a> · <a href="https://www.ukcsuci.org.uk/">Back to UKC-SUCI</a>
</div>

<script>
const netlifyIdentity = window.netlifyIdentity;

netlifyIdentity.on('init', user => {
  if (user) window.location.href = './dashboard.html';
});

netlifyIdentity.on('login', () => {
  window.location.href = './dashboard.html';
});

netlifyIdentity.init();

if (window.location.hash && (window.location.hash.includes('invite_token') || window.location.hash.includes('recovery_token'))) {
  netlifyIdentity.on('init', () => {
    setTimeout(() => netlifyIdentity.open('acceptInvite'), 500);
  });
}

async function handleLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-password').value;
  const btn = document.getElementById('login-btn');
  if (!email || !pass) { showError('Please enter your email and password.'); return; }
  document.getElementById('error-box').classList.remove('show');
  btn.textContent = 'Logging in…';
  btn.disabled = true;
  document.getElementById('login-body').style.display = 'none';
  document.getElementById('loading-screen').classList.add('show');

  try {
    const res = await fetch('https://member.ukcsuci.org.uk/.netlify/identity/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: `grant_type=password&username=${encodeURIComponent(email)}&password=${encodeURIComponent(pass)}`
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error_description || data.msg || 'Incorrect email or password.');
    localStorage.setItem('gotrue.user', JSON.stringify(data));
    window.location.href = '/dashboard';
  } catch(e) {
    document.getElementById('login-body').style.display = 'block';
    document.getElementById('loading-screen').classList.remove('show');
    btn.textContent = 'Log In';
    btn.disabled = false;
    showError(e.message || 'Incorrect email or password. Please try again.');
  }
}

async function handleForgot(e) {
  e.preventDefault();
  const email = document.getElementById('login-email').value.trim();
  if (!email) { showError('Please enter your email address above first.'); return; }
  try {
    await fetch('https://member.ukcsuci.org.uk/.netlify/identity/recover', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    const box = document.getElementById('error-box');
    box.innerHTML = 'Password reset email sent. Check your inbox.';
    box.style.borderColor = '#16A34A';
    box.style.color = '#16A34A';
    box.style.background = '#F0FDF4';
    box.classList.add('show');
  } catch(e) {
    showError('Could not send reset email. Please contact info@ukcsuci.org.uk');
  }
}

function showError(msg) {
  const box = document.getElementById('error-box');
  box.innerHTML = msg;
  box.style.borderColor = '#DC2626';
  box.style.color = '#DC2626';
  box.style.background = '#FEF2F2';
  box.classList.add('show');
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
</script>
</body>
</html>
